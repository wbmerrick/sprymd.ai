name: Feature request
description: Propose a new capability or product improvement.
title: "[feat]: "
labels: ["type:enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome you want. Focus on user value before implementation details.
  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
      description: What user or operator pain does this address?
      placeholder: Clinicians cannot see wearable sync freshness at a glance.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of observable outcomes (Given/When/Then or bullets).
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. What else did you consider and why reject it?
  - type: dropdown
    id: priority_hint
    attributes:
      label: Suggested priority
      options:
        - P0 – blocking / launch critical
        - P1 – high, needed soon
        - P2 – medium, planned
        - P3 – nice to have
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
