name: Bug report
description: Something is broken or behaving incorrectly.
title: "[bug]: "
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Fill in as much as you can so we can reproduce and fix it quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
      placeholder: Patients cannot complete OAuth reconnect after token expiry.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps starting from a known state.
      placeholder: |
        1. Sign in as a patient
        2. Open Connect Devices
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging / preview
        - Local development
        - Unknown
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device (if UI)
      placeholder: Chrome 128 / iOS Safari / Desktop
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots / error text
      description: Paste relevant console output, network errors, or attach screenshots. Redact secrets.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I removed secrets, tokens, and PHI from this report
          required: true
