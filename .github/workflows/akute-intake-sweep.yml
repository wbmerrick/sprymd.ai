name: Akute intake sweep

# Hourly backup for intake part 2 (home address + preferred pharmacy → chart).
# Vercel Hobby crons run at most daily, so this calls the same endpoint hourly.
# Needs repository secret CRON_SECRET = the CRON_SECRET env var on the Vercel project.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call sweep endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set"; exit 1
          fi
          curl --fail --silent --show-error --max-time 90 \
            -H "x-cron-secret: $CRON_SECRET" \
            "https://www.sprymd.ai/api/cron/akute-intake-sweep" \
            | sed -e 's/"results":.*$/"results":[...]}/'
