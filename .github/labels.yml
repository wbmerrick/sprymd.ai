# Canonical GitHub labels for SpryMD.
# Apply with: bash .github/scripts/sync-labels.sh
#
# Naming:
#   type:*      – what kind of work
#   priority:*  – urgency (set during triage)
#   area:*      – where in the product
#   status:*    – workflow state beyond open/closed

- name: type:bug
  color: "d73a4a"
  description: Something isn't working

- name: type:enhancement
  color: "a2eeef"
  description: New feature or request

- name: type:chore
  color: "cfd3d7"
  description: Maintenance, tooling, cleanup

- name: type:docs
  color: "0075ca"
  description: Documentation only

- name: type:question
  color: "d876e3"
  description: Further information is requested

- name: priority:p0
  color: "b60205"
  description: Blocking / launch critical

- name: priority:p1
  color: "d93f0b"
  description: High, needed soon

- name: priority:p2
  color: "fbca04"
  description: Medium, planned

- name: priority:p3
  color: "0e8a16"
  description: Nice to have

- name: area:frontend
  color: "1d76db"
  description: Web UI / client

- name: area:backend
  color: "5319e7"
  description: APIs / serverless

- name: area:connectors
  color: "0052cc"
  description: Wearable OEM connectors / OAuth / sync

- name: area:dashboard
  color: "006b75"
  description: Patient / pro dashboards

- name: area:auth
  color: "b4a8d1"
  description: Auth, accounts, sessions

- name: area:docs
  color: "c2e0c6"
  description: Docs and specs

- name: area:infra
  color: "e99695"
  description: Hosting, env, Supabase, Vercel

- name: area:ci
  color: "fef2c0"
  description: CI/CD and automation

- name: needs-triage
  color: "e4e669"
  description: Awaiting triage (duplicate check, labels, priority)

- name: blocked
  color: "000000"
  description: Waiting on external dependency or decision

- name: duplicate
  color: "cfd3d7"
  description: Duplicate of another issue

- name: good first issue
  color: "7057ff"
  description: Good for newcomers

- name: help wanted
  color: "008672"
  description: Extra attention is needed
