<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" role="img" aria-label="SpryMD">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;display=swap');
      .ll-bg { fill: #000000; }
      .ll-brand {
        opacity: 1;
      }
      .ll-beam-core {
        stroke: url(#ll-beam-grad);
        stroke-width: 3;
        stroke-linecap: round;
        filter: url(#ll-glow);
        opacity: 0;
        stroke-dasharray: 16 420;
        animation: ll-beam-run 1.55s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s forwards;
      }
      .ll-beam-halo {
        stroke: #E87722;
        stroke-width: 10;
        stroke-linecap: round;
        opacity: 0;
        filter: url(#ll-glow);
        stroke-dasharray: 24 420;
        animation: ll-beam-run 1.55s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s forwards;
      }
      .ll-hotspot {
        fill: #FFB068;
        opacity: 0;
        filter: url(#ll-glow);
        animation: ll-hotspot 1.55s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s forwards;
      }
      .ll-underline {
        stroke: #E87722;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 160;
        stroke-dashoffset: 160;
        animation: ll-underline 0.55s ease-out 2.7s forwards;
      }
      @keyframes ll-beam-run {
        0% { opacity: 0; stroke-dashoffset: 0; }
        8% { opacity: 1; }
        78% { opacity: 1; stroke-dashoffset: -400; }
        100% { opacity: 0; stroke-dashoffset: -420; }
      }
      @keyframes ll-hotspot {
        0% { opacity: 0; transform: translateX(20px); }
        10% { opacity: 1; }
        78% { opacity: 1; transform: translateX(372px); }
        100% { opacity: 0; transform: translateX(380px); }
      }
      @keyframes ll-underline {
        to { stroke-dashoffset: 0; }
      }
    </style>
    <filter id="ll-glow" x="-50%" y="-250%" width="200%" height="600%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ll-beam-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E87722" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FF9A4A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E87722" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="ll-reveal">
      <rect x="0" y="0" width="0" height="100">
        <animate attributeName="width" from="0" to="400" begin="0.2s" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>

  <rect class="ll-bg" width="400" height="100"/>
  <line class="ll-beam-halo" x1="20" y1="50" x2="380" y2="50"/>
  <line class="ll-beam-core" x1="20" y1="50" x2="380" y2="50"/>
  <circle class="ll-hotspot" cx="0" cy="50" r="5"/>

  <g clip-path="url(#ll-reveal)">
    <g class="ll-brand">
      <g transform="translate(48, 34)">
        <path d="M22.75 4.31A13.5 13.5 0 0 0 4.31 22.75M9.25 27.69A13.5 13.5 0 0 0 27.69 9.25" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round"/>
        <path d="M18.05 15.22C21.59 13.1 25.69 8.72 27.14 4.86C23.28 6.31 18.9 10.41 16.78 13.95ZM13.95 16.78C10.41 18.9 6.31 23.28 4.86 27.14C8.72 25.69 13.1 21.59 15.22 18.05Z" fill="#E87722"/>
        <circle cx="16" cy="16" r="2.1" fill="#E87722"/>
      </g>
      <text x="96" y="62" font-family="Outfit, system-ui, sans-serif" font-weight="600" font-size="42" letter-spacing="-0.03em" fill="#FFFFFF">
        Spry<tspan fill="#FFFFFF" opacity="0.55">MD</tspan>
      </text>
      <line class="ll-underline" x1="96" y1="74" x2="248" y2="74"/>
    </g>
  </g>
</svg>
